[files]
ignore-hidden = false
extend-exclude = [
  ".git/",
  "home/.config/nvim/",
  "home/.config/alacritty/themes/",
  "home/.tmux/plugins/",
  "home/.config/dms/",
  "home/.config/zsh/p10k.zsh",
]

[default]
extend-words = { kend = "kend", bund = "bund" } # terminfo key name (End); de.bund flatpak id
extend-ignore-re = [
  "[0-9abcdfghijklmnpqrsvwxyz]{26,}",
]
