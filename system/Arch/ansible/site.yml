---
- name: System setup for what Home Manager cannot do
  hosts: localhost
  connection: local
  become: false

  pre_tasks:
    # also in check mode, so package lookups hit a current database
    - name: Refresh the package database
      become: true
      ansible.builtin.package:
        update_cache: true
      check_mode: false
      changed_when: false
      tags: always

    - name: Show what this run will do
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts.distribution }} ({{ ansible_facts.os_family }}),
          host ak, all roles, container={{ is_container }}
      tags: always

  # every role, always; the only gate is is_container
  roles:
    - role: base
      tags: [base]
    - role: desktop
      tags: [desktop]
    - role: nvidia
      tags: [nvidia]
    - role: laptop
      tags: [laptop]
    - role: containers
      tags: [containers]
    # last: nix + homeConfigurations.ak, i.e. all of ~
    - role: nix
      tags: [nix, dotfiles]
