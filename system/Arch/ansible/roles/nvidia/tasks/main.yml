---
- name: NVIDIA role is Arch only
  ansible.builtin.debug:
    msg: "No NVIDIA role for {{ ansible_facts.distribution }}; install the distro driver by hand."
  when: ansible_facts.os_family != 'Archlinux'

- name: Arch NVIDIA
  when: ansible_facts.os_family == 'Archlinux'
  block:
    - name: Install driver, container toolkit and CUDA
      become: true
      community.general.pacman:
        name:
          - nvidia-open
          - nvidia-utils
          - lib32-nvidia-utils # steam
          - nvidia-settings
          - nvidia-container-toolkit
          - cuda
          - nvtop
          - ollama-cuda
        state: present

    - name: Enable nvidia-persistenced
      become: true
      ansible.builtin.systemd:
        name: nvidia-persistenced
        enabled: true
      when: not is_container

    - name: Read the docker daemon config
      become: true
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_json
      failed_when: false
      when: not is_container

    - name: Register the nvidia runtime with docker
      become: true
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      changed_when: true
      notify: Restart docker
      when: >-
        not is_container and
        'nvidia' not in ((docker_daemon_json.content | default('e30=') | b64decode | from_json).runtimes | default({}))
