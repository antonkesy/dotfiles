---
- name: Desktop role is Arch only
  ansible.builtin.debug:
    msg: "Hyprland is not usefully packaged on {{ ansible_facts.distribution }}; skipping the desktop role."
  when: ansible_facts.os_family != 'Archlinux'

- name: Arch desktop
  when: ansible_facts.os_family == 'Archlinux'
  block:
    - name: Enable the multilib repository
      become: true
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK multilib"
        block: |
          [multilib]
          Include = /etc/pacman.d/mirrorlist
      register: multilib

    - name: Refresh the package database
      become: true
      community.general.pacman:
        update_cache: true
      when: multilib.changed
      check_mode: false

    - name: Install compositor stack, session, audio and desktop daemons
      become: true
      community.general.pacman:
        name:
          # --- compositor / session ---
          - hyprland
          - hyprland-protocols
          - uwsm
          - dms-shell-hyprland
          - hyprlock
          - hypridle
          - xdg-desktop-portal-hyprland
          - xdg-desktop-portal-gtk
          - qt5-wayland
          - qt6-wayland
          - polkit-kde-agent
          - cpio # hyprpm
          - glaze
          - greetd
          - greetd-tuigreet
          # --- audio ---
          - pipewire
          - pipewire-alsa
          - pipewire-pulse
          - wireplumber
          - alsa-ucm-conf
          - sof-firmware
          # --- daemons ---
          - networkmanager
          - networkmanager-openconnect
          - cups
          - cups-pdf
          - avahi
          - nss-mdns
          - gvfs
          - udisks2
          - bluez
          - bluez-utils
          - blueman
          - upower
          - gnome-keyring
          - gcr # prompter + ssh-agent
          - kwallet
          - dconf
          # --- media codecs ---
          - gst-libav
          - gst-plugins-good
          - gst-plugins-bad
          - gst-plugins-ugly
          # --- setuid / setcap / 32-bit ---
          - steam
          - gpu-screen-recorder
          - ollama
          # --- GPU userspace ---
          - mesa
          - mesa-utils
          - intel-media-driver
        state: present

    - name: Install wayland helpers, fonts and GUI apps
      become: true
      community.general.pacman:
        name:
          # --- terminal emulator ---
          - alacritty
          # --- hyprland ecosystem ---
          - awww
          - cliphist
          - wl-clipboard
          - grim
          - slurp
          - brightnessctl
          - pamixer
          - playerctl
          - dunst
          - cava
          - waybar
          - wofi
          - rofi
          - dmenu
          - kitty
          - nautilus
          - adwaita-icon-theme
          - gnome-themes-extra
          - dolphin
          - kvantum
          - kvantum-qt5
          - xdg-utils
          # --- keyring / audio / bluetooth / webcam frontends ---
          - libsecret
          - seahorse
          - pavucontrol
          - alsa-utils
          - bluetui
          - guvcview
          - v4l-utils
          - libva-utils
          # --- fonts ---
          - ttf-jetbrains-mono-nerd
          - ttf-cascadia-code-nerd
          - ttf-cascadia-mono-nerd
          - ttf-firacode-nerd
          - ttf-hack-nerd
          - ttf-iosevka-nerd
          - ttf-iosevkaterm-nerd
          - ttf-nerd-fonts-symbols
          - ttf-jetbrains-mono
          - ttf-fira-code
          - ttf-fira-mono
          - ttf-fira-sans
          - noto-fonts
          - noto-fonts-emoji
          - noto-fonts-cjk
          - ttf-liberation
          - ttf-dejavu
          - ttf-ubuntu-font-family
          # --- apps ---
          - firefox
          - godot
          - gimp
          - pinta
          - blender
          - obs-studio
          - okular
          - evince
          - pdfarranger
          - anki
          - vlc
          - vlc-plugins-all
          - amberol
          - thunderbird
          - discord
          - mission-center
          - remmina
          - nextcloud-client
          - baobab
          - file-roller
          - gnome-disk-utility
          - gnome-calculator
          - gnome-font-viewer
          - simple-scan
          - sushi
          - qt5-base
          - qt6-base
          - libtiff
        state: present

    - name: Install helpers and GUI apps from the AUR
      ansible.builtin.include_role:
        name: aur_build
      vars:
        aur_packages:
          - bibata-cursor-theme-bin
          - wlogout
          - tofi
          - wayscriber-bin
          - better-control-git
          - dsearch-bin
          - python-pympress
          - ttf-ms-fonts
          - google-chrome
          - visual-studio-code-bin
          - drawio-desktop-bin
          - wps-office
          - teams-for-linux-bin
          - android-studio

    - name: Configure greetd with tuigreet
      become: true
      ansible.builtin.copy:
        dest: /etc/greetd/config.toml
        mode: "0644"
        content: |
          [terminal]
          vt = 1

          [default_session]
          command = "tuigreet --time --remember --asterisks --cmd 'uwsm start -e -D Hyprland hyprland.desktop'"
          user = "greeter"

    - name: Never lock the account after failed logins
      become: true
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^#?\s*deny\s*='
        line: "deny = 0"
        create: true
        mode: "0644"

    # login: tty and hyprlock
    - name: Unlock the gnome keyring at login (PAM)
      become: true
      ansible.builtin.lineinfile:
        path: "/etc/pam.d/{{ item.0 }}"
        line: "{{ item.1 }}"
        insertafter: EOF
      loop: "{{ ['greetd', 'login'] | product(pam_gnome_keyring_lines) }}"
      vars:
        pam_gnome_keyring_lines:
          - "auth       optional     pam_gnome_keyring.so"
          - "session    optional     pam_gnome_keyring.so auto_start"
      when: not is_container

    - name: Keep the keyring password in sync with the login password (PAM)
      become: true
      ansible.builtin.lineinfile:
        path: /etc/pam.d/passwd
        line: "password   optional     pam_gnome_keyring.so"
        insertafter: EOF
      when: not is_container

    # replaced by the keyring in 2026-09
    - name: Retire pam_gnupg
      become: true
      ansible.builtin.lineinfile:
        path: /etc/pam.d/greetd
        regexp: 'pam_gnupg\.so'
        state: absent
      when: not is_container

    - name: Remove pam-gnupg
      become: true
      community.general.pacman:
        name: pam-gnupg
        state: absent

    - name: Enable desktop services
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop:
        - greetd
        - NetworkManager
        - cups
        - avahi-daemon
        - bluetooth
        - ollama
      when: not is_container
