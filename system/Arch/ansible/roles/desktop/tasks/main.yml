---
# Packages and system configuration only: the compositor stack and the
# daemons behind it (PAM, session, system services, the GPU driver), plus the
# wayland helpers, fonts and GUI apps that need the distro's GL stack. Nothing
# here writes under ~: the hypr/DMS config, session variables and dark mode
# come from the dotfiles flake (home/modules/desktop.nix), applied by the nix
# role.

- name: Desktop role is Arch only
  ansible.builtin.debug:
    msg: "Hyprland is not usefully packaged on {{ ansible_facts.distribution }}; skipping the desktop role."
  when: ansible_facts.os_family != 'Archlinux'

- name: Arch desktop
  when: ansible_facts.os_family == 'Archlinux'
  block:
    # steam (and lib32-*) live in multilib, which Arch ships disabled.
    - name: Enable the multilib repository
      become: true
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK multilib"
        block: |
          [multilib]
          Include = /etc/pacman.d/mirrorlist
      register: multilib

    - name: Refresh the package database
      become: true
      community.general.pacman:
        update_cache: true
      when: multilib.changed
      check_mode: false

    - name: Install compositor stack, session, audio and desktop daemons
      become: true
      community.general.pacman:
        name:
          # --- compositor / session ---
          - hyprland
          - hyprland-protocols
          - uwsm
          # DankMaterialShell; in extra since 1.6 (the AUR `dms` is an unrelated
          # DLNA server that also owns /usr/bin/dms). dms-shell-hyprland satisfies
          # dms-shell's dms-shell-compositor dep; quickshell comes along as a
          # dependency. dms.service is enabled from home/modules/desktop.nix.
          - dms-shell
          - dms-shell-hyprland
          - hyprlock
          - hypridle
          - xdg-desktop-portal-hyprland
          - xdg-desktop-portal-gtk
          - qt5-wayland
          - qt6-wayland
          - polkit-kde-agent
          - cpio # hyprpm plugin builds (manual/hyprpm.sh)
          - glaze
          - greetd
          - greetd-tuigreet
          # --- audio ---
          - pipewire
          - pipewire-alsa
          - pipewire-pulse
          - wireplumber
          - alsa-ucm-conf
          - sof-firmware
          # --- daemons ---
          - networkmanager
          - networkmanager-openconnect
          - cups
          - cups-pdf
          - avahi
          - nss-mdns
          - gvfs
          - udisks2
          - bluez
          - bluez-utils
          - blueman
          - upower
          - gnome-keyring
          - kwallet # credentials for the KDE apps (okular, dolphin)
          - dconf # service behind home-manager's dconf.settings
          # --- media codecs ---
          - gst-libav
          - gst-plugins-good
          - gst-plugins-bad
          - gst-plugins-ugly
          # --- needs system integration (setuid / setcap / 32-bit) ---
          - steam
          - gpu-screen-recorder
          - ollama
          # --- GPU userspace ---
          - mesa
          - mesa-utils # eglinfo, flutter doctor
          - intel-media-driver
        state: present

    # GUI user half; config for these lives in dotfiles (home/.config).
    - name: Install wayland helpers, fonts and GUI apps
      become: true
      community.general.pacman:
        name:
          # --- terminal emulator (config: home/.config/alacritty in dotfiles) ---
          - alacritty
          # --- hyprland ecosystem ---
          - awww
          - cliphist
          - wl-clipboard
          - grim
          - slurp
          - brightnessctl
          - pamixer
          - playerctl
          - dunst
          - cava # DMS audio visualizer
          - waybar
          - wofi
          - rofi
          - dmenu
          - kitty
          - nautilus
          - adwaita-icon-theme
          - gnome-themes-extra
          - dolphin
          - kvantum
          - kvantum-qt5
          - xdg-utils
          # --- keyring / audio / bluetooth / webcam frontends ---
          - libsecret
          - seahorse
          - pavucontrol
          - alsa-utils
          - bluetui
          - guvcview
          - v4l-utils
          - libva-utils
          # --- fonts ---
          - ttf-jetbrains-mono-nerd
          - ttf-cascadia-code-nerd
          - ttf-cascadia-mono-nerd
          - ttf-firacode-nerd
          - ttf-hack-nerd
          - ttf-iosevka-nerd
          - ttf-iosevkaterm-nerd
          - ttf-nerd-fonts-symbols
          - ttf-jetbrains-mono
          - ttf-fira-code
          - ttf-fira-mono
          - ttf-fira-sans
          - noto-fonts
          - noto-fonts-emoji
          - noto-fonts-cjk
          - ttf-liberation
          - ttf-dejavu
          - ttf-ubuntu-font-family
          # --- apps ---
          - firefox
          - godot
          - gimp
          - pinta
          - blender
          - obs-studio
          - okular
          - evince
          - pdfarranger
          - anki
          - vlc
          - vlc-plugins-all
          - amberol
          - thunderbird
          - discord
          - mission-center
          - remmina
          - nextcloud-client
          - baobab
          - file-roller
          - gnome-disk-utility
          - gnome-calculator
          - gnome-font-viewer
          - simple-scan
          - sushi # nautilus previews
          - qt5-base
          - qt6-base
          - libtiff
        state: present

    - name: Install helpers and GUI apps from the AUR
      ansible.builtin.include_role:
        name: aur_build
      vars:
        aur_packages:
          - bibata-cursor-theme-bin
          - wlogout
          - tofi
          - wayscriber-bin
          - better-control-git
          - dsearch-bin
          - python-pympress
          - ttf-ms-fonts
          - google-chrome
          - visual-studio-code-bin
          - drawio-desktop-bin
          - wps-office
          - teams-for-linux-bin
          - android-studio

    - name: Configure greetd with tuigreet
      become: true
      ansible.builtin.copy:
        dest: /etc/greetd/config.toml
        mode: "0644"
        content: |
          [terminal]
          vt = 1

          [default_session]
          # --cmd, not --remember-session: the session must be the uwsm-managed
          # entry every time. uwsm activates graphical-session.target, which is
          # what starts dms.service (enabled in home/modules/desktop.nix). The
          # plain "Hyprland" entry stays in tuigreet's menu as an escape hatch.
          command = "tuigreet --time --remember --asterisks --cmd 'uwsm start -e -D Hyprland hyprland.desktop'"
          user = "greeter"

    - name: Never lock the account after failed logins
      become: true
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^#?\s*deny\s*='
        line: "deny = 0"
        create: true
        mode: "0644"

    - name: Unlock the gnome keyring at login (PAM)
      become: true
      ansible.builtin.lineinfile:
        path: /etc/pam.d/login
        line: "{{ item }}"
        insertafter: EOF
      loop:
        - "auth       optional     pam_gnome_keyring.so"
        - "session    optional     pam_gnome_keyring.so auto_start"
      when: not is_container

    - name: Enable desktop services
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop:
        - greetd
        - NetworkManager
        - cups
        - avahi-daemon
        - bluetooth
        - ollama
      when: not is_container
