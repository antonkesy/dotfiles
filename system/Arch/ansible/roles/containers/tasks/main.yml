---
- name: Install docker
  become: true
  ansible.builtin.package:
    name: "{{ 'docker' if ansible_facts.os_family == 'Archlinux' else 'docker.io' }}"
    state: present

- name: Enable docker
  become: true
  ansible.builtin.systemd:
    name: docker
    enabled: true
  when: not is_container

- name: Ensure the docker group exists
  become: true
  ansible.builtin.group:
    name: docker
    state: present

- name: Add the user to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    groups: docker
    append: true
  when: not ansible_check_mode

- name: Install VirtualBox
  become: true
  community.general.pacman:
    name:
      - virtualbox
      - virtualbox-host-dkms
    state: present
  when: ansible_facts.os_family == 'Archlinux' and not is_container
