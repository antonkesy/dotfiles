---
- name: Load per-distro package names
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Install base packages
  become: true
  ansible.builtin.package:
    name: "{{ base_packages }}"
    state: present

- name: Set timezone
  become: true
  community.general.timezone:
    name: Europe/Berlin
  when: not is_container

- name: Enable en_US.UTF-8 locale
  become: true
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Make zsh the login shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: "{{ zsh_path }}"

- name: Add Flathub
  become: true
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    state: present
  when: ansible_facts.os_family == 'Archlinux' and not is_container

- name: Install the AUR helper and debtap (.deb to pacman packages)
  ansible.builtin.include_role:
    name: aur_build
  vars:
    aur_packages:
      - yay
      - debtap
  when: ansible_facts.os_family == 'Archlinux'

- name: Install /etc/default/grub
  become: true
  ansible.builtin.copy:
    src: grub
    dest: /etc/default/grub
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_facts.os_family == 'Archlinux'

- name: Regenerate grub.cfg (os-prober picks up other installed OSes)
  become: true
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true
  when: ansible_facts.os_family == 'Archlinux' and not is_container

- name: Create journald drop-in dir
  become: true
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts.os_family == 'Archlinux'

- name: Install zram, sysctl and journald config (zram size applies on next boot)
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: zram-generator.conf, dest: /etc/systemd/zram-generator.conf }
    - { src: 99-zram.sysctl.conf, dest: /etc/sysctl.d/99-zram.conf }
    - { src: journald-size.conf, dest: /etc/systemd/journald.conf.d/size.conf }
  loop_control:
    label: "{{ item.dest }}"
  notify:
    - Apply sysctl
    - Restart journald
  when: ansible_facts.os_family == 'Archlinux'

- name: Enable weekly pacman cache cleanup
  become: true
  ansible.builtin.systemd:
    name: paccache.timer
    enabled: true
    state: started
  when: ansible_facts.os_family == 'Archlinux' and not is_container
