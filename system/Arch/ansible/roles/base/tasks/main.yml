---
- name: Load per-distro package names
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Install base packages
  become: true
  ansible.builtin.package:
    name: "{{ base_packages }}"
    state: present

- name: Set timezone
  become: true
  community.general.timezone:
    name: Europe/Berlin
  when: not is_container

- name: Enable en_US.UTF-8 locale
  become: true
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

# Distro zsh as login shell: works even without nix, same .zshrc.
- name: Make zsh the login shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: "{{ zsh_path }}"

- name: Add Flathub
  become: true
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    state: present
  when: ansible_facts.os_family == 'Archlinux' and not is_container

- name: Install debtap from the AUR (.deb to pacman packages)
  ansible.builtin.include_role:
    name: aur_build
  vars:
    aur_packages:
      - debtap
  when: ansible_facts.os_family == 'Archlinux'

# archinstall installs GRUB; this owns its config afterwards.
- name: Install /etc/default/grub
  become: true
  ansible.builtin.copy:
    src: grub
    dest: /etc/default/grub
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: grub_default
  when: ansible_facts.os_family == 'Archlinux'

- name: Regenerate grub.cfg
  become: true
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true
  when: ansible_facts.os_family == 'Archlinux' and grub_default.changed and not is_container
