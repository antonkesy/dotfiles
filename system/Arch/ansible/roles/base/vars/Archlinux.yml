---
# Root-only or kernel/firmware-coupled. CLI tools: home/modules/base.nix.
base_packages:
  - base-devel
  - git
  - curl
  - sudo
  - zsh
  - openssh
  - flatpak
  - vim # an editor for root/visudo without nix in PATH
  # --- boot ---
  - grub
  - efibootmgr
  - os-prober # Windows entry for the dual-boot machines
  - linux-firmware
  - intel-ucode
  - amd-ucode
  # --- filesystems / storage ---
  - dosfstools
  - exfatprogs
  - ntfs-3g
  - btrfs-progs
  - xfsprogs
  - mdadm
  - lvm2
  - smartmontools
  - hdparm
  - smbclient
  # --- network ---
  - nftables
  - ipset
  - ethtool
  - ca-certificates
  # --- kernel-coupled ---
  - cpupower
  - perf
zsh_path: /usr/bin/zsh
