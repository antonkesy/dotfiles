---
- name: Install the SMB client
  become: true
  ansible.builtin.package:
    name: cifs-utils
    state: present

# root:root all the way down: mount(8) refuses a user mount whose path an
# unprivileged user could swap out underneath it.
- name: Create the NAS mount points
  become: true
  ansible.builtin.file:
    path: "{{ nas_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nas_shares }}"

- name: Create the credentials directory
  ansible.builtin.file:
    path: "{{ nas_credentials_file | dirname }}"
    state: directory
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0700"

# One-time migration off the root-only location. That design assumed mount.cifs would
# read /etc/nas/credentials on ak's behalf; it does not, so every unprivileged mount
# died with "error 13 (Permission denied) opening credential file". remote_src keeps
# the password out of Ansible's variables on the way across.
- name: Look for the old root-only credentials file
  ansible.builtin.stat:
    path: /etc/nas/credentials
  register: nas_old_credentials

- name: Look for the credentials in their new home
  ansible.builtin.stat:
    path: "{{ nas_credentials_file }}"
  register: nas_new_credentials

- name: Move the old credentials into ak's home
  become: true
  ansible.builtin.copy:
    src: /etc/nas/credentials
    dest: "{{ nas_credentials_file }}"
    remote_src: true
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0600"
  when:
    - nas_old_credentials.stat.exists
    - not nas_new_credentials.stat.exists

- name: Drop the old root-only credentials directory
  become: true
  ansible.builtin.file:
    path: /etc/nas
    state: absent
  when: nas_old_credentials.stat.exists

- name: Seed the credentials placeholder, never overwriting a real password
  ansible.builtin.copy:
    dest: "{{ nas_credentials_file }}"
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0600"
    force: false
    content: |
      # Samba account on {{ nas_host }}. Filled in by hand, never in git.
      username={{ nas_username }}
      password={{ nas_password_placeholder }}

- name: Read the credentials back
  ansible.builtin.slurp:
    src: "{{ nas_credentials_file }}"
  register: nas_credentials
  no_log: true
  when: not ansible_check_mode

# A warning, not a failure: failing here would abort the play before the nix role
# runs home-manager, and the NAS is optional on the road.
- name: Warn while the NAS password is still the placeholder
  ansible.builtin.debug:
    msg: >-
      {{ nas_credentials_file }} still says password={{ nas_password_placeholder }}.
      Run `$EDITOR {{ nas_credentials_file }}` and put the Samba password of
      {{ nas_username }}@{{ nas_host }} there; until then nas-mount.service
      mounts nothing.
  when:
    - not ansible_check_mode
    - nas_credentials is defined
    - nas_password_placeholder in (nas_credentials.content | b64decode)

# One-time migration off the open NFS exports. The old block used
# x-systemd.automount, so systemd-fstab-generator emitted mnt-nas-*.automount.
# Those have to die *before* fstab loses the lines: after a daemon_reload without
# them they stay loaded with no fragment, keep autofs attached to /mnt/nas/*, and
# the cifs mount would stack on top. The new noauto cifs entries generate a .mount
# but never a .automount, so the presence of one is exactly the "still on NFS"
# signal. The stat stays ungated -- it is read-only, the directory is simply absent
# in a container, and gating it would leave the loops below with no results.
- name: Look for the automount units of the old NFS block
  ansible.builtin.stat:
    path: "/run/systemd/generator/{{ (nas_root ~ '/' ~ item) | regex_replace('^/', '') | regex_replace('/', '-') }}.automount"
  register: nas_legacy
  loop: "{{ nas_shares }}"

- name: Detach the autofs triggers of the old NFS block
  become: true
  ansible.builtin.systemd:
    name: "{{ (nas_root ~ '/' ~ item.item) | regex_replace('^/', '') | regex_replace('/', '-') }}.automount"
    state: stopped
  loop: "{{ nas_legacy.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and not is_container

- name: Unmount what those automounts had mounted
  become: true
  ansible.builtin.systemd:
    name: "{{ (nas_root ~ '/' ~ item.item) | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
    state: stopped
  loop: "{{ nas_legacy.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and not is_container

# Same marker as the old NFS block on purpose: blockinfile replaces everything
# between BEGIN/END, so the three nfs lines are swapped for three cifs lines.
# Changing the marker would strand the old lines in /etc/fstab forever.
- name: Offer the NAS shares to ak as user-mountable SMB entries (fstab)
  become: true
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} ANSIBLE MANAGED BLOCK nas"
    block: |
      {% for share in nas_shares %}
      //{{ nas_host }}/{{ share }} {{ nas_root }}/{{ share }} cifs {{ nas_mount_options | join(',') }} 0 0
      {% endfor %}
  register: nas_fstab

# Drops the now-unbacked NFS units and emits the noauto cifs ones. Mounting is
# nas-mount.service's job, so nothing is started here.
- name: Pick up the units the fstab generator writes
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: nas_fstab.changed and not is_container
