---
# One host, ak, everything on: the roles install packages and the system half
# (pacman/AUR, systemd, PAM); the nix role then applies everything under ~
# (homeConfigurations.ak from the flake at the repo root, hypr/DMS config
# included).

# This playbook lives at <repo>/system/Arch/ansible; the flake is <repo>.
# It has to be ~/Projects/dotfiles (ak.dotfilesDir); the nix role asserts it.
dotfiles_dir: "{{ playbook_dir | dirname | dirname | dirname }}"

# Docker-based tests: no systemd, no kernel modules, no PAM edits.
# virtualization_type is undefined when no virtualisation is detected.
is_container: "{{ (ansible_facts.virtualization_type | default('')) in ['docker', 'container', 'podman'] }}"
