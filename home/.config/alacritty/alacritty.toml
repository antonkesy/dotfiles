[env]
TERM="xterm-256color"

[window]
decorations = "None"
padding = { x = 0, y = 0 }
opacity = 1.0

[scrolling]
history = 50000

[font]
normal = { family = "Hack Nerd Font Mono", style = "Regular" }
size = 12

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[general]
import = [ "~/.config/alacritty/themes/themes/iterm.toml" ]

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[bell]
duration = 0

[[keyboard.bindings]]
key = "Space"
mods = "Control"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "Y"
mode = "Vi"
action = "Copy"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Ctrl+/ -> ^_ (nvim <C-/>); Shift variant for layouts where / needs Shift (de: Shift+7)
[[keyboard.bindings]]
key = "/"
mods = "Control"
chars = "\u001F"

[[keyboard.bindings]]
key = "/"
mods = "Control|Shift"
chars = "\u001F"
