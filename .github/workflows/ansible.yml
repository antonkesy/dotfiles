name: ansible
on:
  pull_request:
    paths: [system/**, "!system/Windows-11-*/**", "!system/Ubuntu-26.04-WSL2/**", Makefile, .dockerignore, .github/workflows/ansible.yml]
  push:
    branches: [main]
    paths: [system/**, "!system/Windows-11-*/**", "!system/Ubuntu-26.04-WSL2/**", Makefile, .dockerignore, .github/workflows/ansible.yml]
permissions:
  contents: read
# ansible-lint runs in pre-commit.yml, pinned there
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make -C system/Arch test
