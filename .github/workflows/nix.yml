name: nix
on:
  pull_request:
  push:
    branches: [main]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate
        run: nix eval --raw './home#homeConfigurations.ak.activationPackage.drvPath'
      - name: Dry-build
        run: nix build ./home#homeConfigurations.ak.activationPackage --dry-run
