name: nix
on:
  pull_request:
  push:
    branches: [main]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Evaluation only: building a full desktop closure does not fit in CI.
      - name: Evaluate every host
        run: |
          nix eval --json '.#nixosConfigurations' \
            --apply 'builtins.mapAttrs (_: c: c.config.system.build.toplevel.drvPath)'
