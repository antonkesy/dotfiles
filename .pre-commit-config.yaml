# DankMaterialShell rewrites its own JSON; keep the seeds byte-identical to upstream.
exclude: ^home/.config/(nvim|DankMaterialShell/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--shell=bash", "--severity=error"]
        exclude: ^(home/.config/zsh/p10k.zsh)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        args: ["--force-exclude"]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  # Hand-written Hyprland Lua only; the other dms/*.lua are written by DMS.
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua-github
        files: ^home/.config/hypr/([^/]+|dms/binds-user)\.lua$
  # Nix tooling comes from the flake itself (home/), so pre-commit and `nix fmt`
  # can never disagree and nothing gets rebuilt from cabal/cargo.
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: bash -c 'cd home && exec nix --extra-experimental-features "nix-command flakes" fmt --'
        language: system
        pass_filenames: false
        files: \.nix$
      - id: deadnix
        name: deadnix
        entry: nix --extra-experimental-features "nix-command flakes" run --inputs-from ./home nixpkgs#deadnix -- --edit --no-lambda-pattern-names
        language: system
        files: \.nix$
      - id: ansible-lint
        name: ansible-lint
        # From the playbook directory: ansible-lint installs requirements.yml
        # into ./.ansible and resolves collections relative to the cwd.
        entry: bash -c 'cd system/Arch/ansible && exec python3 -m ansiblelint --force-color'
        language: python
        additional_dependencies: [ansible-lint==25.12.2]
        pass_filenames: false
        files: ^system/Arch/ansible/
      # upstream luacheck hook needs luarocks on the host
      - id: luacheck
        name: luacheck
        entry: nix --extra-experimental-features "nix-command flakes" run --inputs-from ./home nixpkgs#luaPackages.luacheck -- --config home/.config/hypr/.luacheckrc
        language: system
        files: ^home/.config/hypr/([^/]+|dms/binds-user)\.lua$
      - id: hadolint
        name: hadolint
        entry: nix --extra-experimental-features "nix-command flakes" run --inputs-from ./home nixpkgs#hadolint --
        language: system
        files: Dockerfile$
      # shellcheck reads zsh as bash; this catches zsh-only syntax errors.
      - id: zsh-syntax
        name: zsh -n
        entry: nix --extra-experimental-features "nix-command flakes" shell --inputs-from ./home nixpkgs#zsh -c sh -c 'for f; do zsh -n "$f" || exit 1; done' --
        language: system
        files: (\.zsh|\.zshrc)$
