# DankMaterialShell rewrites its own JSON; keep the seeds byte-identical to upstream.
exclude: ^home/.config/(nvim|DankMaterialShell/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--shell=bash", "--severity=error"]
        exclude: ^(home/.config/zsh/p10k.zsh)
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
  # Nix tooling comes from the flake itself, so pre-commit and `nix fmt` can
  # never disagree and nothing gets rebuilt from cabal/cargo.
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nix fmt --
        language: system
        pass_filenames: false
        files: \.nix$
      - id: deadnix
        name: deadnix
        entry: nix run --inputs-from . nixpkgs#deadnix -- --edit --no-lambda-pattern-names
        language: system
        files: \.nix$
      - id: ansible-lint
        name: ansible-lint
        # From the playbook directory: ansible-lint installs requirements.yml
        # into ./.ansible and resolves collections relative to the cwd.
        entry: bash -c 'cd system/Arch/ansible && exec python3 -m ansiblelint --force-color'
        language: python
        additional_dependencies: [ansible-lint==25.12.2]
        pass_filenames: false
        files: ^system/Arch/ansible/
